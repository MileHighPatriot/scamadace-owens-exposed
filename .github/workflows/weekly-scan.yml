name: Weekly claim scan

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scan
        run: node scripts/weekly-scan.js

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-scan
          path: research/weekly-scan.*

      - name: Open or update GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('research/weekly-scan.md', 'utf8');
            const title = 'Weekly claim scan — ' + new Date().toISOString().slice(0, 10);
            const labels = ['weekly-scan'];
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'weekly-scan',
                color: '6B4F1D',
                description: 'Monday candidate scan for new Owens / Kirk claims',
              });
            } catch (e) {
              /* label already exists */
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-scan',
              per_page: 5,
            });
            if (issues.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            }
